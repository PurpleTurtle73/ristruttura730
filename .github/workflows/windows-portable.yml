name: windows-portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.14.0'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # per creare la release e allegare lo zip
    steps:
      - uses: actions/checkout@v5

      - name: Calcola versione e nome zip
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=ristruttura730-portable-win64-$VERSION.zip" >> "$GITHUB_ENV"

      - name: Prepara cartella portable
        shell: pwsh
        run: |
          $zip = "python-$env:PYTHON_VERSION-embed-amd64.zip"
          Invoke-WebRequest "https://www.python.org/ftp/python/$env:PYTHON_VERSION/$zip" -OutFile $zip
          New-Item -ItemType Directory portable | Out-Null
          Expand-Archive $zip -DestinationPath portable/py

          # abilita pip nell'embeddable: decommenta "import site" nel file ._pth
          $pth = Get-ChildItem portable/py/*._pth | Select-Object -First 1
          (Get-Content $pth) -replace '^#\s*import site', 'import site' | Set-Content $pth
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          portable/py/python.exe get-pip.py --no-warn-script-location
          portable/py/python.exe -m pip install --no-warn-script-location fastapi "uvicorn[standard]"

          Copy-Item app portable/app -Recurse
          Copy-Item LICENSE portable/LICENSE.txt

          $bat = @(
            '@echo off'
            'cd /d %~dp0'
            'set DB_PATH=data\app.db'
            'start "" http://localhost:8730'
            'py\python.exe -m uvicorn app.main:app --port 8730'
          )
          $bat | Set-Content portable/avvia.bat -Encoding ascii
          $env:VERSION | Set-Content portable/VERSION.txt -Encoding ascii

      - name: Smoke test del pacchetto
        shell: pwsh
        run: |
          $env:DB_PATH = "smoke.db"
          portable/py/python.exe -c "import sys; sys.path.insert(0, 'portable'); from app.main import app; print('import ok')"

      - name: Crea zip
        shell: pwsh
        run: Compress-Archive -Path portable/* -DestinationPath $env:ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: ristruttura730-portable-win64-${{ env.VERSION }}
          path: ${{ env.ZIP }}

      - name: Allega alla release (solo su tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$ZIP" \
          || gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
